<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      {% include sidebar.html %}
    </aside>
    <main class="content">
      <article class="markdown-body">
        {{ content }}
      </article>
      <footer class="site-footer">
        <a href="https://github.com/purelogiccode/CHDSharp/edit/main/docs/{{ page.path }}">Edit this page on GitHub</a>
        &middot; <a href="https://github.com/purelogiccode/CHDSharp">CHDSharp repository</a>
        &middot; <a href="https://github.com/purelogiccode/CHDSharp/wiki">Wiki</a>
      </footer>
    </main>
  </div>
</body>
</html>
